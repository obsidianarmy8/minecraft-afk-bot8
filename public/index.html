<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>minecart-afk-bot8 Live</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; max-width: 800px; margin: 0 auto; }
    h1 { margin-top: 0; color: #38bdf8; }
    .status { font-size: 1.2rem; margin-bottom: 16px; }
    .online { color: #4ade80; }
    .offline { color: #f87171; }
    #logs { background: #0f172a; border-radius: 8px; padding: 12px; height: 400px; overflow-y: auto; font-family: monospace; font-size: 13px; }
    .log-line { margin: 2px 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>minecart-afk-bot8</h1>
    <div class="status">
      Status: <span id="status" class="offline">Connecting...</span>
    </div>
    <div id="logs"></div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const logsEl = document.getElementById('logs');

    function connectWS() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`\( {protocol}// \){location.host}`);

      ws.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.type === 'status') {
          statusEl.textContent = data.connected ? 'ONLINE' : 'OFFLINE';
          statusEl.className = data.connected ? 'online' : 'offline';
        }
        if (data.type === 'log') {
          const div = document.createElement('div');
          div.className = 'log-line';
          div.textContent = data.message;
          logsEl.appendChild(div);
          logsEl.scrollTop = logsEl.scrollHeight;
        }
      };

      ws.onclose = () => setTimeout(connectWS, 3000);
    }
    connectWS();
  </script>
</body>
</html>
